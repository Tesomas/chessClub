spring.application.name=ChessClub
server.port=8081
spring.profiles.active=local

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/chessclub}

# Actuator: only health is exposed by default; the "local" profile also exposes loggers
management.endpoints.web.exposure.include=health
# Create the indexes declared on @Document classes (e.g. Game's player/date compound indexes) at startup
spring.data.mongodb.auto-index-creation=true
