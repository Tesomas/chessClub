name: CI

# When to run: on every pull request, and on every push to master.
on:
  pull_request:
  push:
    branches: [master]

# Cancel an in-progress run when a newer commit is pushed to the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (unit, integration, Bruno API)
    runs-on: ubuntu-latest   # GitHub-hosted VM; has Docker preinstalled, which Testcontainers needs
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 24

      - name: Set up Node (for the Bruno CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-tests/package-lock.json

      - name: Set up Gradle (with dependency caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Bruno CLI
        run: npm ci
        working-directory: api-tests

      # testAll = ./gradlew test (unit/component/integration + JaCoCo) then ./gradlew apiTest (Bruno).
      # `bash ./gradlew` because the wrapper is not marked executable in git.
      - name: Run all tests
        run: bash ./gradlew testAll --console=plain

      # always(): upload reports even when tests fail, which is when you want them most.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
            build/test-results/
          if-no-files-found: ignore
