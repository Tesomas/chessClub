services:
  mongo-seed:
    build: ./docker/mongo-seed
    image: chessclub-mongo-seed
    container_name: chessclub-mongo-seed
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
